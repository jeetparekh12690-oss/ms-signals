<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Signal Board</title>
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#192339;--line:#26324b;--tx:#e6ebf5;--mut:#8b97b3;--acc:#5b9dff;
--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--gry:#94a3b8}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;background:var(--bg);color:var(--tx);
font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:100%;max-width:340px;text-align:center}
.gbox h1{margin:8px 0 4px;font-size:20px}.gbox p{margin:0 0 18px;color:var(--mut);font-size:13px}
.gbox input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
.gbox input:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#04122a;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;width:100%;margin-top:12px}
.btn:disabled{opacity:.6;cursor:wait}.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1.t{margin:0;font-size:22px}.sub{color:var(--mut);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:24px;line-height:1.1}.kpi span{color:var(--mut);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:10px}
.lab{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;min-width:58px}
input[type=search],input[type=date]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;min-width:0}
input[type=search]{flex:1 1 220px}input:focus{border-color:var(--acc)}
input[type=date]{color-scheme:dark}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04122a;font-weight:600}
.tabs{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;color:var(--mut)}
.tab.on{background:var(--card2);color:var(--tx);border-color:var(--acc)}
.meta{color:var(--mut);font-size:12.5px;margin:2px 2px 10px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--card2);color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}tbody tr:hover{background:#16213a}
td.num,th.num{text-align:right}
a.sc{color:var(--acc);text-decoration:none;font-weight:600;cursor:pointer}a.sc:hover{text-decoration:underline}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.s-L{background:rgba(251,191,36,.15);color:var(--warn)}.s-B{background:rgba(52,211,153,.15);color:var(--ok)}
.s-N{background:rgba(148,163,184,.15);color:var(--gry)}.s-W{background:rgba(248,113,113,.15);color:var(--bad)}
.bk{color:var(--mut);font-size:12.5px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.gh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card2)}
.gh b{font-size:15px}.gi{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.gi .d{min-width:92px;font-weight:600}.gi .x{color:var(--mut);font-size:13px}
.empty{padding:30px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:12px}
footer{color:var(--mut);font-size:11.5px;margin-top:22px;text-align:center}
@media(max-width:640px){
 .kpis{gap:8px}.kpi b{font-size:20px}.kpi{padding:10px}
 table,thead,tbody,tr,td{display:block;width:100%}thead{display:none}
 table{background:transparent;border:0}
 tr{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;padding:6px 4px}
 td{border:0;padding:5px 12px;display:flex;justify-content:space-between;gap:10px;white-space:normal;text-align:right}
 td::before{content:attr(data-l);color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left}
 td.num{text-align:right}.lab{min-width:100%}
}

.mm{margin:0 0 14px}.mmh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between;margin:0 2px 8px}.mmh b{font-size:15px}
.mmg{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:760px){.mmg{grid-template-columns:1fr 1fr}}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.mct{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between;margin-bottom:10px}.mct b{font-size:15px}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:3px 11px 3px 9px;white-space:nowrap;background:rgba(255,255,255,.07);color:var(--tx)}.tag::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--zc);margin-right:7px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.zb{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.zs{height:24px;border-radius:5px;opacity:.38}.zs.on{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px #e6ebf5}
.z0{background:#a11d1d;color:#fff}.z1{background:#ef4444;color:#fff}.z2{background:#f9a8d4;color:#3b0a26}.z3{background:#3b82f6;color:#fff}.z4{background:#1e3a8a;color:#fff}.zc0{--zc:#a11d1d}.zc1{--zc:#ef4444}.zc2{--zc:#f9a8d4}.zc3{--zc:#3b82f6}.zc4{--zc:#1e3a8a}.zs,.wc{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}.wc{font-size:10.5px}
.zl{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;font-size:10.5px;color:var(--mut);text-align:center;margin:5px 0 12px;line-height:1.15}.zl .on{color:var(--tx);font-weight:700}
.wk{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}.wc{height:22px;border-radius:4px;position:relative}
.wc:hover::after{content:attr(data-tip);position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:#e6ebf5;color:#0b1220;padding:5px 8px;border-radius:6px;font-size:11.5px;line-height:1.35;white-space:pre;z-index:9;pointer-events:none}
.wd{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:10px;color:var(--mut);text-align:center;margin-top:3px}
.mcap{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:0 0 5px}

</style>
</head>
<body>
<div id="gate" hidden>
  <form class="gbox" id="gf" autocomplete="off">
    <div style="font-size:30px">&#128274;</div>
    <h1>Signal Board</h1><p>Enter your password to continue</p>
    <input id="pw" type="password" placeholder="Password" autofocus>
    <button class="btn" id="go" type="submit">Unlock</button>
    <div class="err" id="er"></div>
  </form>
</div>
<div id="app" class="wrap" hidden></div>

<script>
(function(){
"use strict";
var BLOB=JSON.parse(document.getElementById("blob").textContent);
var $=function(s,e){return (e||document).querySelector(s)};
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var ST={L:["Limit active"],B:["Bought"],N:["Not filled"],W:["Withdrawn"]};
var D=null,S={q:"",bk:{},st:{},from:"",to:"",view:"signals",sk:"date",sd:-1};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fd(i){if(!i)return "–";var p=i.split("-");return +p[2]+" "+MON[+p[1]-1]+" "+p[0]}
function fp(x){return x==null?"–":"₹"+Number(x).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

async function decrypt(pw,e){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.s),iterations:e.i,hash:"SHA-256"},km,
    {name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.n)},key,b64(e.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

function start(data){
  if(D)return;
  D=data;$("#gate").hidden=true;$("#app").hidden=false;document.title=D.meta.title||document.title;build();render();
}

/* ---------- gate ---------- */
if(BLOB.data){start(BLOB.data)}
else{
  $("#gate").hidden=false;
  var tryPw=async function(pw,silent){
    var b=$("#go");b.disabled=true;if(!silent)$("#er").textContent="";
    try{var d=await decrypt(pw,BLOB.enc);try{sessionStorage.setItem("k",pw)}catch(e){}start(d);return true}
    catch(e){if(!silent)$("#er").textContent="Incorrect password";try{sessionStorage.removeItem("k")}catch(x){}}
    b.disabled=false;return false;
  };
  $("#gf").addEventListener("submit",function(ev){ev.preventDefault();tryPw($("#pw").value,false)});
  try{var k=sessionStorage.getItem("k");if(k)tryPw(k,true)}catch(e){}
}

/* ---------- layout ---------- */
function build(){
  var m=D.meta,tabs=[["signals","Signals"],["script","By script"]];
  (D.extra||[]).forEach(function(x,i){tabs.push(["x"+i,x.title])});if(D.meter&&D.meter.detail)tabs.push(["mm",D.meter.tab||"Meter"]);
  var h='<header><div><h1 class="t">'+esc(m.title)+'</h1><div class="sub">Updated '+fd(m.updated)+(m.note?" · "+esc(m.note):"")+'</div></div></header>'
   +'<div id="mm"></div><div class="kpis" id="kp"></div>'
   +'<div class="panel" id="flt">'
   +'<div class="row"><input id="q" type="search" list="sl" placeholder="Search a script, e.g. HAL" autocomplete="off"><datalist id="sl"></datalist></div>'
   +'<div class="row"><span class="lab">Index</span><span id="cb"></span></div>'
   +'<div class="row"><span class="lab">Status</span><span id="cs"></span></div>'
   +'<div class="row"><span class="lab">Date</span><input id="df" type="date"><span class="bk">to</span><input id="dt" type="date">'
   +'<span id="cp"></span></div></div>'
   +'<div class="tabs" id="tb"></div><div class="meta" id="mt"></div><div id="out"></div>'
   +'<footer>Updated automatically every weekday after market close. Limit prices are for the next session and are refreshed daily. Not investment advice.</footer>';
  $("#app").innerHTML=h;
  var cb=$("#cb");(m.buckets||[]).forEach(function(b){cb.insertAdjacentHTML("beforeend",'<button class="chip" data-bk="'+esc(b)+'">'+esc(b)+'</button> ')});
  var cs=$("#cs");["L","B","N","W"].forEach(function(k){cs.insertAdjacentHTML("beforeend",'<button class="chip" data-st="'+k+'">'+ST[k][0]+'</button> ')});
  var pr=[["Today","today"],["This week","week"],["This month","month"],["Last month","last"],["All","all"]];
  pr.forEach(function(p){$("#cp").insertAdjacentHTML("beforeend",'<button class="chip" data-pr="'+p[1]+'">'+p[0]+'</button> ')});
  var sc={};D.rows.forEach(function(r){sc[r.script]=1});
  $("#sl").innerHTML=Object.keys(sc).sort().map(function(s){return '<option value="'+esc(s)+'">'}).join("");
  $("#tb").innerHTML=tabs.map(function(t){return '<button class="tab" data-v="'+t[0]+'">'+esc(t[1])+'</button>'}).join("");

  $("#q").addEventListener("input",function(e){S.q=e.target.value.trim().toUpperCase();render()});
  $("#df").addEventListener("change",function(e){S.from=e.target.value;render()});
  $("#dt").addEventListener("change",function(e){S.to=e.target.value;render()});
  $("#app").addEventListener("click",function(e){
    var t=e.target.closest("[data-bk],[data-st],[data-pr],[data-v],[data-sort],[data-sc]");if(!t)return;
    if(t.dataset.bk){S.bk[t.dataset.bk]=!S.bk[t.dataset.bk]}
    else if(t.dataset.st){S.st[t.dataset.st]=!S.st[t.dataset.st]}
    else if(t.dataset.pr){preset(t.dataset.pr)}
    else if(t.dataset.v){S.view=t.dataset.v}
    else if(t.dataset.sort){var k=t.dataset.sort;if(S.sk===k)S.sd=-S.sd;else{S.sk=k;S.sd=k==="date"?-1:1}}
    else if(t.dataset.sc){S.q=t.dataset.sc;S.view="script";$("#q").value=S.q}
    render();
  });
}

function preset(p){
  var a=new Date(D.meta.asof+"T00:00:00"),f="",t=iso(a);
  if(p==="today")f=t;
  else if(p==="week"){var d=new Date(a);d.setDate(d.getDate()-((d.getDay()+6)%7));f=iso(d)}
  else if(p==="month")f=iso(new Date(a.getFullYear(),a.getMonth(),1));
  else if(p==="last"){f=iso(new Date(a.getFullYear(),a.getMonth()-1,1));t=iso(new Date(a.getFullYear(),a.getMonth(),0))}
  else{f="";t=""}
  S.from=f;S.to=t;$("#df").value=f;$("#dt").value=t;
}

/* ---------- data ---------- */
function filtered(){
  var anyB=Object.keys(S.bk).some(function(k){return S.bk[k]}),anyS=Object.keys(S.st).some(function(k){return S.st[k]});
  return D.rows.filter(function(r){
    if(S.q&&r.script.toUpperCase().indexOf(S.q)<0)return false;
    if(anyB&&!S.bk[r.bucket])return false;
    if(anyS&&!S.st[r.status])return false;
    if(S.from&&r.date<S.from)return false;
    if(S.to&&r.date>S.to)return false;
    return true;
  });
}
function detail(r){
  if(r.status==="L")return "Limit "+fp(r.limit)+" · valid till "+fd(r.until);
  if(r.status==="B")return "Bought "+fd(r.boughtOn)+" @ "+fp(r.boughtAt);
  if(r.status==="N")return "Not filled";
  return "Withdrawn";
}


function fdl(i){var p=i.split("-");return +p[2]+" "+MON[+p[1]-1]}
function zbar(L,zi){return '<div class="zb">'+L.map(function(n,i){return '<div class="zs z'+i+(i===zi?' on':'')+'" title="'+esc(n)+'">'+(i+1)+'</div>'}).join("")+'</div>'
  +'<div class="zl">'+L.map(function(n,i){return '<div class="'+(i===zi?'on':'')+'">'+esc(n)+'</div>'}).join("")+'</div>'}
function wstrip(w){
  var c=w.map(function(x){return '<div class="wc z'+x.zi+'" data-tip="'+esc(x.tip)+'">'+(x.zi+1)+'</div>'}).join("");
  var d=w.map(function(x,i){return '<div>'+((w.length-1-i)%2===0?fdl(x.date):"")+'</div>'}).join("");
  return '<div class="wk">'+c+'</div><div class="wd">'+d+'</div>'}
function mmRender(){
  var el=$("#mm");if(!el)return;var M=D.meter;
  var hide=S.view==="mm";el.style.display=hide?"none":"";var kp=$("#kp");if(kp)kp.style.display=hide?"none":"";
  if(hide||!M)return;
  el.innerHTML='<div class="mm"><div class="mmh"><b>'+esc(M.head)+'</b><span class="sub">'+esc(M.sub)+'</span></div><div class="mmg">'
   +M.indices.map(function(x){return '<div class="mc"><div class="mct"><b>'+esc(x.name)+'</b><span class="tag zc'+x.zi+'">'+esc(x.tag)+'</span></div>'
     +zbar(M.labels,x.zi)+'<div class="mcap">'+esc(M.wl)+'</div>'+wstrip(x.weeks)+'</div>'}).join("")+'</div></div>';
}

/* ---------- render ---------- */
function render(){
  var rows=filtered(),i;mmRender();
  var asof=D.meta.asof,mo=asof.slice(0,7);
  var act=D.rows.filter(function(r){return r.status==="L"}).length;
  var neu=D.rows.filter(function(r){return r.date===asof}).length;
  var bgt=D.rows.filter(function(r){return r.status==="B"&&r.boughtOn&&r.boughtOn.slice(0,7)===mo}).length;
  $("#kp").innerHTML='<div class="kpi"><b>'+act+'</b><span>Limit orders active</span></div>'
    +'<div class="kpi"><b>'+neu+'</b><span>New today</span></div>'
    +'<div class="kpi"><b>'+bgt+'</b><span>Bought this month</span></div>';
  document.querySelectorAll("[data-bk]").forEach(function(b){b.classList.toggle("on",!!S.bk[b.dataset.bk])});
  document.querySelectorAll("[data-st]").forEach(function(b){b.classList.toggle("on",!!S.st[b.dataset.st])});
  document.querySelectorAll("[data-v]").forEach(function(b){b.classList.toggle("on",b.dataset.v===S.view)});
  var x=S.view.charAt(0)==="x"&&S.view.length>1&&!isNaN(+S.view.slice(1));
  $("#flt").style.display=x?"none":"";
  var out=$("#out");if(S.view==="mm"){$("#flt").style.display="none";$("#mt").textContent="";if(typeof meterDetail==="function")out.innerHTML=meterDetail(D.meter);return}
  if(x){var e=D.extra[+S.view.slice(1)];$("#mt").textContent="";out.innerHTML=extraTable(e);return}
  $("#mt").textContent="Showing "+rows.length+" of "+D.rows.length+" signals";
  if(!rows.length){out.innerHTML='<div class="empty">No signals match these filters.</div>';return}
  out.innerHTML=S.view==="script"?byScript(rows):table(rows);
}
function table(rows){
  var k=S.sk,d=S.sd;
  rows=rows.slice().sort(function(a,b){
    var x=k==="limit"?(a.limit||a.boughtAt||0):a[k],y=k==="limit"?(b.limit||b.boughtAt||0):b[k];
    if(x===y)return a.script<b.script?-1:1;return (x>y?1:-1)*d});
  var ar=function(c){return S.sk===c?(S.sd>0?" ▲":" ▼"):""};
  var h='<table><thead><tr><th data-sort="script">Script'+ar("script")+'</th><th data-sort="bucket">Index'+ar("bucket")+'</th>'
   +'<th data-sort="date">Signal date'+ar("date")+'</th><th data-sort="status">Status'+ar("status")+'</th>'
   +'<th class="num" data-sort="limit">Price'+ar("limit")+'</th><th>Details</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td data-l="Script"><a class="sc" data-sc="'+esc(r.script)+'">'+esc(r.script)+'</a></td>'
     +'<td data-l="Index"><span class="bk">'+esc(r.bucket)+'</span></td>'
     +'<td data-l="Signal date">'+fd(r.date)+'</td>'
     +'<td data-l="Status"><span class="pill s-'+r.status+'">'+ST[r.status][0]+'</span></td>'
     +'<td class="num" data-l="'+(r.status==="B"?"Bought at":"Limit price")+'">'+fp(r.status==="B"?r.boughtAt:r.limit)+'</td>'
     +'<td data-l="Details">'+esc(r.status==="L"?"Valid till "+fd(r.until):r.status==="B"?"Bought "+fd(r.boughtOn):"–")+'</td></tr>';
  });
  return h+"</tbody></table>";
}
function byScript(rows){
  var g={};rows.forEach(function(r){(g[r.script]=g[r.script]||[]).push(r)});
  var keys=Object.keys(g).sort(function(a,b){var x=g[a][0].date,y=g[b][0].date;
    var la=g[a].reduce(function(m,r){return r.date>m?r.date:m},"");var lb=g[b].reduce(function(m,r){return r.date>m?r.date:m},"");
    return la===lb?(a<b?-1:1):(la>lb?-1:1)});
  return keys.map(function(s){
    var L=g[s].slice().sort(function(a,b){return a.date<b.date?1:-1});
    return '<div class="grp"><div class="gh"><b>'+esc(s)+'</b><span class="bk">'+esc(L[0].bucket)+' · '+L.length+' signal'+(L.length>1?"s":"")+'</span></div>'
     +L.map(function(r){return '<div class="gi"><span class="d">'+fd(r.date)+'</span><span class="pill s-'+r.status+'">'+ST[r.status][0]+'</span><span class="x">'+esc(detail(r))+'</span></div>'}).join("")+'</div>';
  }).join("");
}
function extraTable(e){
  if(!e.rows||!e.rows.length)return '<div class="empty">Nothing to show.</div>';
  var h='<table><thead><tr>'+e.columns.map(function(c){return "<th>"+esc(c)+"</th>"}).join("")+"</tr></thead><tbody>";
  e.rows.forEach(function(r){h+="<tr>"+r.map(function(v,i){return '<td data-l="'+esc(e.columns[i])+'">'+esc(v==null?"–":v)+"</td>"}).join("")+"</tr>"});
  return h+"</tbody></table>";
}
})();
</script>
</body>
</html>
